<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" viewBox="0 0 1000 720"><defs><style>.title{font-size:22px;font-weight:700;fill:#1a1a1a}.subtitle{font-size:12px;fill:#666}.label{font-size:13px;fill:#1a1a1a;font-weight:600}.mono,.small{font-size:11px}.small{fill:#444}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1a1a1a}.yellow-soft{fill:#f4b728;fill-opacity:.15}.gray-soft{fill:#e5e7eb;fill-opacity:.4}.green-soft{fill:#16a34a;fill-opacity:.1}.blue-soft{fill:#3b82f6;fill-opacity:.08}.border{fill:none;stroke:#d4d4d8;stroke-width:1.5}.arrow,.arrow-dashed,.border-strong{fill:none;stroke:#1a1a1a;stroke-width:1.5}.arrow,.arrow-dashed{marker-end:url(#a)}.arrow-dashed{stroke-dasharray:4 3}</style><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><text x="500" y="32" class="title" text-anchor="middle">SIWZ · Sign in with Zcash</text><text x="500" y="52" class="subtitle" text-anchor="middle">The auth primitive Zcash didn&apos;t have. Three sign-in flows, one verifier.</text><rect width="220" height="240" x="40" y="100" class="yellow-soft border" rx="8"/><text x="150" y="125" class="label" text-anchor="middle">User&apos;s Zcash wallet</text><text x="150" y="142" class="small" text-anchor="middle">Zodl · Zingo · YWallet · Zodl ·</text><text x="150" y="156" class="small" text-anchor="middle">eZcash · Zenith · zcash-cli · …</text><rect width="180" height="42" x="60" y="180" class="gray-soft border" rx="5"/><text x="150" y="198" class="small" font-weight="600" text-anchor="middle">A. signmessage</text><text x="150" y="214" class="small" text-anchor="middle">paste signature back</text><rect width="180" height="42" x="60" y="232" class="gray-soft border" rx="5"/><text x="150" y="250" class="small" font-weight="600" text-anchor="middle">B. shielded send + memo</text><text x="150" y="266" class="small" text-anchor="middle">scan ZIP 321 QR → confirm</text><rect width="180" height="42" x="60" y="284" class="gray-soft border" rx="5"/><text x="150" y="302" class="small" font-weight="600" text-anchor="middle">C. MetaMask + Zcash Snap</text><text x="150" y="318" class="small" text-anchor="middle">permission-grant only</text><rect width="320" height="500" x="340" y="100" class="yellow-soft border-strong" rx="8"/><text x="500" y="125" class="label" text-anchor="middle">Your app (e.g. ZBooks, comments wall, anything)</text><text x="500" y="142" class="small" text-anchor="middle">Next.js / NextAuth · runs anywhere</text><rect width="280" height="60" x="360" y="170" class="green-soft border" rx="5"/><text x="500" y="190" class="label" text-anchor="middle">@siwz/react</text><text x="500" y="208" class="mono" text-anchor="middle">&lt;SignInWithZcash /&gt; &lt;MemoSignIn /&gt;</text><text x="500" y="222" class="small" text-anchor="middle">drop-in components · QR · paste · poll</text><rect width="280" height="60" x="360" y="248" class="green-soft border" rx="5"/><text x="500" y="268" class="label" text-anchor="middle">@siwz/next-auth</text><text x="500" y="286" class="mono" text-anchor="middle">SiwzProvider(...) issueNonce()</text><text x="500" y="300" class="small" text-anchor="middle">credentials provider · stateless nonces</text><rect width="280" height="80" x="360" y="326" class="green-soft border" rx="5"/><text x="500" y="346" class="label" text-anchor="middle">@siwz/core</text><text x="500" y="364" class="mono" text-anchor="middle">SiwzMessage · verifyMessage · ZIP 321</text><text x="500" y="378" class="mono" text-anchor="middle">issueMemoChallenge · verifyMemoChallenge</text><text x="500" y="394" class="small" text-anchor="middle">protocol primitives · pure TS · 59 tests</text><rect width="280" height="156" x="360" y="424" class="blue-soft border" rx="5"/><text x="500" y="444" class="label" text-anchor="middle">Explorer dispatcher (your backend)</text><text x="500" y="462" class="small" text-anchor="middle">picks backend by address type:</text><text x="500" y="486" class="mono" text-anchor="middle">t1… → BlockchairExplorer</text><text x="500" y="500" class="small" text-anchor="middle">public API · zero infra · transparent</text><text x="500" y="524" class="mono" text-anchor="middle">zs… / u1… → LightwalletExplorer</text><text x="500" y="538" class="small" text-anchor="middle">decrypts memos with IVK · privacy-preserving</text><text x="500" y="562" class="mono" text-anchor="middle">tests → MockExplorer</text><text x="500" y="576" class="small" text-anchor="middle">DEMO mode · no chain needed for CI</text><rect width="220" height="240" x="740" y="100" class="yellow-soft border" rx="8"/><text x="850" y="125" class="label" text-anchor="middle">Zcash network (mainnet)</text><text x="850" y="142" class="small" text-anchor="middle">where the proof actually lands</text><rect width="180" height="42" x="760" y="180" class="gray-soft border" rx="5"/><text x="850" y="198" class="small" font-weight="600" text-anchor="middle">transparent tx</text><text x="850" y="214" class="small" text-anchor="middle">amount = nonce · publicly visible</text><rect width="180" height="42" x="760" y="232" class="gray-soft border" rx="5"/><text x="850" y="250" class="small" font-weight="600" text-anchor="middle">shielded tx + memo</text><text x="850" y="266" class="small" text-anchor="middle">memo = SIWZ:nonce · encrypted</text><rect width="180" height="42" x="760" y="284" class="gray-soft border" rx="5"/><text x="850" y="302" class="small" font-weight="600" text-anchor="middle">no on-chain artifact</text><text x="850" y="318" class="small" text-anchor="middle">snap signs the dApp permission grant</text><rect width="220" height="100" x="740" y="380" class="blue-soft border" rx="8"/><text x="850" y="402" class="label" text-anchor="middle">Verifier backend</text><text x="850" y="420" class="small" text-anchor="middle">public Blockchair API (transparent),</text><text x="850" y="436" class="small" text-anchor="middle">or your zcashd/zingo-cli over RPC</text><text x="850" y="454" class="small" text-anchor="middle">(shielded · needs IVK)</text><path d="M 260 200 L 360 200" class="arrow"/><path d="M 260 252 L 360 268" class="arrow"/><path d="M 260 304 L 360 364" class="arrow"/><path d="M 240 250 Q 500 60 760 200" class="arrow-dashed"/><text x="500" y="80" class="small" text-anchor="middle">user broadcasts the tx from their wallet</text><path d="M 640 500 Q 720 480 760 430" class="arrow"/><text x="700" y="495" class="small" text-anchor="end">poll for tx</text><path d="M 850 340 L 850 380" class="arrow"/><text x="500" y="650" class="small" text-anchor="middle">The verifier never sees a private key. A signed message OR a paid tx is sufficient proof of address ownership.</text><text x="500" y="668" class="small" text-anchor="middle">Apps consume SIWZ as 3 npm packages. Transparent sign-in needs zero new server-side software; the public Blockchair API is enough.</text><text x="500" y="690" class="small" font-style="italic" text-anchor="middle">Built for the Zechub hackathon · MIT licensed · siwz.dev/spec</text></svg>